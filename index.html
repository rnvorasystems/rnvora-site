  --soft:#f3f7fb;
  --line:#e3ebf3;
}
*{margin:0;padding:0;box-sizing:border-box}
html[dir="rtl"] body{font-family:'Cairo',sans-serif}
html[dir="ltr"] body{font-family:'Inter',sans-serif}
body{color:var(--ink);background:var(--bg);line-height:1.7}
.container{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:40px;width:40px;object-fit:cover;border-radius:8px}
.brand span{font-weight:800;font-size:20px;color:var(--navy);letter-spacing:.5px}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.nav-links a:hover{color:var(--blue)}
.lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang-toggle button{border:0;background:transparent;padding:7px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.lang-toggle button.active{background:var(--navy);color:#fff}
.hero{padding:96px 0 80px;background:linear-gradient(160deg,#f3f7fb 0%,#ffffff 55%)}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.eyebrow{display:inline-block;background:#e8f1fd;color:var(--blue);font-weight:700;font-size:14px;padding:6px 16px;border-radius:999px;margin-bottom:20px}
h1{font-size:46px;line-height:1.25;font-weight:800;color:var(--navy);margin-bottom:18px}
.hero p{font-size:19px;color:var(--muted);max-width:560px;margin-bottom:32px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;box-shadow:0 8px 24px rgba(27,111,224,.28)}
.btn-ghost{border:1.5px solid var(--line);color:var(--navy);background:#fff}
.hero-logo{display:flex;justify-content:center}
.hero-logo img{max-width:340px;width:100%;border-radius:24px;box-shadow:0 24px 60px rgba(11,44,77,.14)}
section{padding:80px 0}
.section-title{font-size:34px;font-weight:800;color:var(--navy);margin-bottom:12px}
.section-sub{color:var(--muted);font-size:17px;max-width:640px;margin-bottom:48px}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;transition:box-shadow .2s ease}
.card:hover{box-shadow:0 12px 32px rgba(11,44,77,.09)}
.card .icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e8f1fd,#e0f7f4);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px}
.card p{font-size:15px;color:var(--muted)}
.why{background:var(--navy);color:#fff}
.why .section-title{color:#fff}
.why .section-sub{color:#b9c9db}
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
.why-item{display:flex;gap:16px}
.why-item .mark{flex:0 0 28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.why-item h3{font-size:17px;margin-bottom:6px}
.why-item p{color:#b9c9db;font-size:15px}
.case{background:var(--soft);border-radius:24px;padding:56px}
.case-quote{font-size:24px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:20px}
.case p{color:var(--muted);font-size:16px;max-width:760px}
.case .tag{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--blue);font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;margin-bottom:22px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.contact-card{border:1px solid var(--line);border-radius:16px;padding:32px;text-align:center}
.contact-card h3{color:var(--navy);font-size:18px;margin-bottom:8px}
.contact-card p{color:var(--muted);font-size:15px;margin-bottom:18px}
.contact-card a{direction:ltr;display:inline-block}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px;text-align:center}
.trust-bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.trust-bar span{background:#fff;border:1px solid var(--line);color:var(--navy);font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
.step .num{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.step h3{color:var(--navy);font-size:18px;margin-bottom:8px}
.step p{color:var(--muted);font-size:15px}
.faq-item{border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:14px}
.faq-item h3{color:var(--navy);font-size:17px;margin-bottom:6px}
.faq-item p{color:var(--muted);font-size:15px}
.wa-float{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;background:#25d366;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,211,102,.45);text-decoration:none;transition:transform .15s ease}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:30px;height:30px;fill:#fff}
@media(max-width:860px){.steps{grid-template-columns:1fr}}
@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .hero-logo img{max-width:240px}
  h1{font-size:34px}
  .services-grid{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  .nav-links a{display:none}
  .case{padding:32px}
}

html{scroll-behavior:smooth}
section[id],div[id]{scroll-margin-top:84px}
.side-nav{position:fixed;bottom:94px;inset-inline-end:22px;z-index:59;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.side-nav-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 8px 20px rgba(11,44,77,.35);display:flex;align-items:center;justify-content:center}
.side-nav-links{display:none;flex-direction:column;gap:8px;align-items:flex-end}
.side-nav-links.open{display:flex}
.side-nav-links a{background:#fff;border:1px solid var(--line);color:var(--navy);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;text-decoration:none;box-shadow:0 6px 16px rgba(11,44,77,.14);white-space:nowrap}
</style>

function setLang(l){
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(T[l][k]) el.textContent = T[l][k];
  });
  document.getElementById('btn-ar').classList.toggle('active', l==='ar');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.title = l==='ar' ? 'RNVORA | أنظمة الأعمال والأتمتة' : 'RNVORA | Business Systems & Automation';
  try{ localStorage.setItem('rnvora_lang', l); }catch(e){}
}
